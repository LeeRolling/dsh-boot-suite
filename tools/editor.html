<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>启动动画 · 模板编辑器</title>
<style>
  :root {
    /* 间距阶：4 的倍数（§3.2 值必须来自系统） */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
    /* 字号阶：三档就够（§4.1 不要近似值） */
    --fs-sm:12px; --fs-md:13px; --fs-lg:15px;
    /* 颜色：正文只有 ink / dim 两色；ok / err 只给状态行用（§2.2.a） */
    --bg:#14161a; --panel:#1b1e24; --line:#2a2f38; --ink:#e8ecf2; --dim:#9aa4b2;
    --accent:#3964fe; --ok:#31c48d; --err:#f06a6a; --danger:#c0392b;
    --radius:8px;
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:var(--fs-md)/1.6 "Segoe UI","Microsoft YaHei",sans-serif; display:flex; flex-direction:column; }

  /* 顶栏：标题是页面的第一层级，播放控制降为三级（§2.1 §2.8） */
  header { display:flex; align-items:center; gap:var(--sp-2); padding:var(--sp-2) var(--sp-4); border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; box-shadow:0 1px 2px rgba(0,0,0,.35); }
  header h1 { font-size:var(--fs-lg); margin:0 var(--sp-3) 0 0; font-weight:600; letter-spacing:.01em; white-space:nowrap; }
  header .sp { flex:1; }
  header .group { display:flex; gap:var(--sp-1); padding-left:var(--sp-2); border-left:1px solid var(--line); }

  button { background:#242932; color:var(--ink); border:1px solid var(--line); border-radius:var(--radius); padding:6px var(--sp-3); font:inherit; cursor:pointer; }
  button:hover { background:#2b313b; border-color:#3d4654; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  /* hover 用更深一档：白字在 #4a73ff 上只有 4.05:1，不达 WCAG AA（impeccable 检出的） */
  button.primary:hover { background:#3f68f5; border-color:#3f68f5; }
  /* 播放控制是三级操作：透明底、无边框，只在 hover 时出现底色 */
  button.ghost { background:transparent; border-color:transparent; color:var(--dim); }
  button.ghost:hover { background:#242932; color:var(--ink); border-color:var(--line); }
  button.danger { border-color:#5a2a2a; color:#f0a0a0; }
  /* 键盘焦点必须看得见（P0：没有焦点环 = 键盘用户没法操作） */
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline:2px solid var(--accent); outline-offset:2px;
  }

  main { flex:1; min-height:0; display:flex; }
  .preview { flex:1.15; border-right:1px solid var(--line); display:flex; flex-direction:column; min-width:0; }
  .preview iframe { flex:1; border:0; background:#000; width:100%; }
  .preview .bar { padding:var(--sp-2) var(--sp-3); color:var(--dim); border-top:1px solid var(--line); font-size:var(--fs-sm); }

  /* 侧栏：组间 24、组内 8（§3.6 组距要明显大于组内距） */
  .side { width:460px; overflow:auto; padding:var(--sp-4) var(--sp-4) var(--sp-6); }
  h2 { font-size:var(--fs-sm); text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:var(--sp-5) 0 var(--sp-2); }
  h2:first-child { margin-top:0; }
  .row { display:flex; gap:var(--sp-2); align-items:center; }
  .field { margin:var(--sp-2) 0; }
  .field > label { display:block; font-size:var(--fs-sm); color:var(--dim); margin-bottom:var(--sp-1); }
  input[type=text], input[type=number], select, textarea {
    width:100%; background:#101318; color:var(--ink); border:1px solid var(--line);
    border-radius:var(--radius); padding:6px var(--sp-2); font:inherit;
  }
  input[type=text]:hover, input[type=number]:hover, select:hover { border-color:#3d4654; }
  input::placeholder { color:#6b7482; }
  /* 去掉 number 的原生上下箭头：那是浏览器默认控件（§8.1） */
  input[type=number]{ -moz-appearance:textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  input[type=color] { width:34px; height:28px; padding:0; border:1px solid var(--line); border-radius:var(--radius); background:transparent; }

  .colors { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-2); }
  .colors .field { display:flex; align-items:center; gap:var(--sp-2); margin:0; }
  .colors .field label { margin:0; flex:0 0 76px; }

  .step { border:1px solid var(--line); border-radius:calc(var(--radius) + 1px); margin:var(--sp-4) 0; background:var(--panel); }
  .step > .head { display:flex; align-items:center; gap:var(--sp-1); padding:var(--sp-2) var(--sp-3); border-bottom:1px solid var(--line); }
  .step > .head b { flex:1; font-weight:600; font-size:var(--fs-md); }
  .step > .body { padding:var(--sp-3) var(--sp-3) var(--sp-4); }
  .step .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-2) var(--sp-3); }
  .flags { display:flex; gap:var(--sp-4); flex-wrap:wrap; margin-top:var(--sp-2); font-size:var(--fs-sm); color:var(--dim); }
  .flags label { display:flex; align-items:center; gap:var(--sp-1); }
  .mini { padding:3px 10px; font-size:var(--fs-sm); border-radius:6px; }

  #status { color:var(--dim); font-size:var(--fs-sm); max-width:34vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; opacity:0; transition:opacity .2s; }
  #status.show { opacity:1; }
  #status.ok { color:var(--ok); }
  #status.err { color:var(--err); }
  .hint { color:var(--dim); font-size:var(--fs-sm); margin:var(--sp-2) 0 0; }
  .empty { color:var(--dim); font-size:var(--fs-sm); padding:var(--sp-5) var(--sp-4); text-align:center; border:1px dashed var(--line); border-radius:var(--radius); }

  /* ── M2 时间线 ─────────────────────────────────────────────── */
  :root { --tl-name:132px; --tl-gap:8px; }
  .tlbar { flex:0 0 auto; border-top:1px solid var(--line); background:#101318; padding:var(--sp-2) var(--sp-3) var(--sp-3); max-height:44vh; overflow:auto; user-select:none; }
  .stageWrap { position:relative; flex:1 1 auto; min-height:0; }
  .stageWrap iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  #tlCanvasHit { position:absolute; inset:0; z-index:4; cursor:crosshair; }
  #tlSelBox { position:absolute; z-index:5; pointer-events:none; border:1px solid var(--accent); border-radius:2px; }
  .tlguide { position:absolute; z-index:6; pointer-events:none; background:#ffd45e; }
  .tlguide.v { top:0; bottom:0; width:1px; }
  .tlguide.h { left:0; right:0; height:1px; }
  #tlSelBox span { position:absolute; left:0; bottom:100%; margin-bottom:2px; padding:1px 6px; font-size:11px; white-space:nowrap; background:var(--accent); color:#fff; border-radius:3px; }
  #tlCanvasHit.hidden { display:none; }
  .tlbar-row { display:flex; align-items:center; gap:var(--sp-2); margin-bottom:var(--sp-2); font-size:var(--fs-sm); color:var(--dim); }
  .tlbar-row .sp { flex:1; }
  .tlclock { font-family:Consolas,monospace; color:var(--ink); letter-spacing:.04em; }
  .tllbl { display:flex; align-items:center; gap:6px; }
  .tllbl input { width:84px; }
  .tlruler { position:relative; height:24px; border-bottom:1px solid var(--line); margin:0 0 6px calc(var(--tl-name) + var(--tl-gap)); cursor:pointer; }
  .tlplayhead { position:absolute; top:0; bottom:-9999px; width:2px; border-radius:1px; background:var(--accent); pointer-events:none; z-index:5; }
  /* 播放头把手：只有这里能拖，避免和"选中文字"抢手势 */
  .tlhead { position:absolute; top:-1px; width:14px; height:14px; margin-left:-7px; z-index:6; cursor:ew-resize;
    background:var(--accent); clip-path:polygon(50% 100%, 0 0, 100% 0); border:0; padding:0; }
  .tlhead:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  .tltracks { display:flex; flex-direction:column; gap:3px; }
  .tlrow { display:flex; align-items:center; gap:var(--sp-2); height:26px; }
  .tlrow.sel { background:#1b2230; border-radius:6px; }
  .tlname { flex:0 0 var(--tl-name); font-size:var(--fs-sm); color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .tlname .dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px; background:var(--accent); opacity:.65; }
  .tllane { position:relative; flex:1; height:26px; border-left:1px solid var(--line); background:#151a21; }
  .tlkf { position:absolute; top:50%; width:11px; height:11px; margin:-5.5px 0 0 -5.5px; background:var(--ink); transform:rotate(45deg); border:1px solid #0a0c10; cursor:grab; }
  .tlkf.sel { background:var(--accent); }
  .tlkf:hover { background:#ffd45e; }
  .tlhint { color:var(--dim); font-size:var(--fs-sm); padding:var(--sp-2) 0; }
  .tlins { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-2); }
  .tlins .field { margin:0; }
  .tlins input[type=range] { width:100%; }
  .tlsel { font-size:var(--fs-sm); color:var(--dim); margin-top:var(--sp-2); }

  /* 商店卡片：一张缩略图 + 元信息 + 一个主操作（安装） */
  .store-card { display:flex; gap:var(--sp-3); padding:var(--sp-3); border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); margin-bottom:var(--sp-3); }
  .store-card > img { width:168px; height:94px; object-fit:cover; border-radius:6px; background:#000; flex:0 0 auto; }
  .store-card .meta { flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--sp-1); }
  .store-card .name { font-weight:600; }
  .store-card .by { color:var(--dim); font-size:var(--fs-sm); }
  .store-card .desc { color:var(--dim); font-size:var(--fs-sm); line-height:1.5; }
  .store-card .tags { display:flex; gap:var(--sp-1); flex-wrap:wrap; }
  .store-card .tag { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:999px; padding:1px 8px; }
  .store-card .actions { display:flex; gap:var(--sp-2); align-items:center; margin-top:var(--sp-1); }
  .toolbar { display:flex; gap:var(--sp-2); align-items:center; margin-bottom:var(--sp-3); }

  /* 窄窗口：预览和侧栏上下堆叠，别把预览压成一条缝（§3.3） */
  @media (max-width: 1100px) {
    main { flex-direction:column; flex:1; min-height:0; }
    .preview { height:46vh; border-right:0; border-bottom:1px solid var(--line); }
    .side { width:auto; }
    /* 窄窗口压缩顶栏，别让它折成两行（§3.3 响应式要设计过，不是挤出来） */
    header { gap:var(--sp-1); padding:var(--sp-2); }
    header h1 { font-size:var(--fs-md); margin-right:var(--sp-2); }
    header .group { padding-left:var(--sp-1); gap:2px; }
    #pick { width:150px !important; }
    button { padding:5px 9px; }
    button.ghost { padding:5px 6px; }
  }
  @media (max-width: 780px) {
    header h1 { display:none; }
  }
</style>
</head>
<body>
<header>
  <h1>启动动画 · 模板编辑器</h1>
  <div class="group">
    <select id="pick" style="width:200px"><option value="">载入模板…</option></select>
    <button id="load">载入</button>
    <button id="storeBtn">🏪 商店</button>
    <button id="tlBtn">⏱ 时间线</button>
    <button id="formBtn" hidden>📝 表单</button>
  </div>
  <div class="group">
    <button id="play" class="ghost">▶ 播放</button>
    <button id="pause" class="ghost">⏸ 暂停</button>
    <button id="replay" class="ghost">⟲ 从头播</button>
  </div>
  <span id="status"></span>
  <span class="sp"></span>
  <button id="newTpl" class="primary">＋ 新建模板</button>
  <button id="importBtn">导入 JSON</button>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
  <button id="download">下载 JSON</button>
  <button id="save" class="primary">保存到本地</button>
</header>

<main>
  <section class="preview">
    <div class="stageWrap">
      <iframe id="frame" src="about:blank"></iframe>
      <div id="tlCanvasHit" hidden></div>
      <div id="tlSelBox" hidden><span></span></div>
      <div id="tlGuideV" class="tlguide v" hidden></div>
      <div id="tlGuideH" class="tlguide h" hidden></div>
    </div>
    <div class="tlbar" id="tlbar" hidden>
      <div class="tlbar-row">
        <button id="tlPlay" class="mini">▶</button>
        <button id="tlPause" class="mini">⏸</button>
        <span class="tlclock" id="tlclock">0.00s / 0.00s</span>
        <label class="tllbl">时长 <input id="tlDur" type="number" min="600" max="30000" step="100"></label>
        <label class="tllbl">当前图层 <select id="tlLayerPick" style="width:170px"></select></label>
        <span class="sp"></span>
        <button id="tlAddKf" class="mini">◆ 打关键帧</button>
        <button id="tlAddLayer" class="mini">+ 图层</button>
        <button id="tlAddSeg" class="mini">+ 分段</button>
        <button id="tlAddLogo" class="mini">+ 线描</button>
      </div>
      <div class="tlruler" id="tlruler"><div class="tlplayhead" id="tlplayhead"></div></div>
      <div class="tltracks" id="tltracks"></div>
    </div>
    <div class="bar" id="pbar">还没生成预览</div>
  </section>
  <aside class="side" id="side"></aside>
</main>

<script>
(function () {
  var API = '/dsh-startup'
  var tpl = null
  var draftId = ''
  var timer = 0
  var side = document.getElementById('side')
  var frame = document.getElementById('frame')
  var pbar = document.getElementById('pbar')
  var status = document.getElementById('status')

  function say(msg, kind) {
    var mark = kind === 'ok' ? '✓ ' : (kind === 'err' ? '✕ ' : '')
    status.textContent = mark + msg
    status.className = 'show ' + (kind || '')
    clearTimeout(say._t)
    say._t = setTimeout(function () { status.className = '' }, 3200)
  }

  function json(url, init) {
    return fetch(API + url, init).then(function (r) { return r.json() })
  }

  function esc(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') }

  function get(path) {
    var parts = path.split('.'), cur = tpl
    for (var i = 0; i < parts.length; i++) { if (cur == null) return undefined; cur = cur[parts[i]] }
    return cur
  }
  function set(path, value) {
    var parts = path.split('.'), cur = tpl
    for (var i = 0; i < parts.length - 1; i++) {
      var k = parts[i]
      if (cur[k] == null || typeof cur[k] !== 'object') cur[k] = /^\d+$/.test(parts[i + 1]) ? [] : {}
      cur = cur[k]
    }
    cur[parts[parts.length - 1]] = value
    scheduleDraft()
  }

  /* 输入框绑定：改完不重绘整张表单（否则会丢焦点），只更新状态 + 排一次预览 */
  function bindText(el, path, numeric) {
    el.value = get(path) == null ? '' : get(path)
    el.addEventListener('input', function () {
      set(path, numeric ? (Number(el.value) || 0) : el.value)
      if (path.indexOf('steps.') === 0 && /(zh|badge|en)$/.test(path)) updateStepTitle(path.split('.')[1])
    })
  }
  function updateStepTitle(i) {
    var box = side.querySelector('[data-step-title="' + i + '"]')
    if (box) box.textContent = '第 ' + (Number(i) + 1) + ' 幕 · ' + (get('steps.' + i + '.zh') || '（未命名）')
  }

  function field(label, inputEl) {
    var d = document.createElement('div')
    d.className = 'field'
    var l = document.createElement('label')
    l.textContent = label
    d.appendChild(l)
    d.appendChild(inputEl)
    return d
  }

  function renderColors() {
    var keys = [['mode', '明暗模式'], ['bg', '底色'], ['bg2', '次级底色'], ['ink', '主文字'], ['inkSoft', '次级文字'], ['muted', '灰字'], ['hair', '纱（可 rgba）'], ['hairSoft', '细纱（可 rgba）'], ['accent', '强调色'], ['glitchA', '故障色 A'], ['glitchB', '故障色 B']]
    var wrap = document.createElement('div')
    wrap.className = 'colors'
    if (!tpl.theme) tpl.theme = {}
    keys.forEach(function (pair) {
      var key = pair[0], label = pair[1]
      var d = document.createElement('div')
      d.className = 'field'
      var l = document.createElement('label'); l.textContent = label
      d.appendChild(l)
      if (key === 'mode') {
        var sel = document.createElement('select')
        ;[['light', '浅色版式'], ['dark', '深色版式']].forEach(function (o) {
          var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]
          if ((tpl.theme.mode || 'light') === o[0]) op.selected = true
          sel.appendChild(op)
        })
        sel.onchange = function () { tpl.theme.mode = sel.value; scheduleDraft() }
        d.appendChild(sel)
      } else {
        var inp = document.createElement('input')
        inp.type = 'text'; inp.placeholder = '#rrggbb 或 rgba(...)'
        inp.value = tpl.theme[key] || ''
        inp.oninput = function () { tpl.theme[key] = inp.value; scheduleDraft() }
        d.appendChild(inp)
        if (/^#[0-9a-fA-F]{6}$/.test(inp.value)) {
          var cp = document.createElement('input')
          cp.type = 'color'; cp.value = inp.value
          cp.oninput = function () { inp.value = cp.value; tpl.theme[key] = cp.value; scheduleDraft() }
          d.appendChild(cp)
        }
      }
      wrap.appendChild(d)
    })
    return wrap
  }

  function renderStep(step, i) {
    var box = document.createElement('div')
    box.className = 'step'
    var head = document.createElement('div')
    head.className = 'head'
    var b = document.createElement('b')
    b.setAttribute('data-step-title', String(i))
    b.textContent = '第 ' + (i + 1) + ' 幕 · ' + (step.zh || '（未命名）')
    b.title = '点一下标题：预览跳到这一幕'
    b.style.cursor = 'pointer'
    b.onclick = function () { pushDraft({ start: i }) }
    head.appendChild(b)
    var onlyOne = document.createElement('button'); onlyOne.className = 'mini'; onlyOne.textContent = '▶ 本幕'
    onlyOne.title = '只播这一幕'
    onlyOne.onclick = function () { pushDraft({ start: i, count: 1 }) }
    head.appendChild(onlyOne)
    var fromHere = document.createElement('button'); fromHere.className = 'mini'; fromHere.textContent = '⇥ 从此幕'
    fromHere.title = '从这一幕往下播到结尾'
    fromHere.onclick = function () { pushDraft({ start: i }) }
    head.appendChild(fromHere)
    var up = document.createElement('button'); up.className = 'mini'; up.textContent = '↑'
    up.onclick = function () { if (i === 0) return; var a = tpl.steps; var t = a[i - 1]; a[i - 1] = a[i]; a[i] = t; render() }
    var dn = document.createElement('button'); dn.className = 'mini'; dn.textContent = '↓'
    dn.onclick = function () { var a = tpl.steps; if (i >= a.length - 1) return; var t = a[i + 1]; a[i + 1] = a[i]; a[i] = t; render() }
    var del = document.createElement('button'); del.className = 'mini danger'; del.textContent = '✕'
    del.onclick = function () { if (tpl.steps.length <= 1) { say('至少要留一幕', 'err'); return } tpl.steps.splice(i, 1); render() }
    head.appendChild(up); head.appendChild(dn); head.appendChild(del)
    box.appendChild(head)

    var body = document.createElement('div')
    body.className = 'body'
    var g = document.createElement('div'); g.className = 'grid2'
    function pair(label, key, numeric, ph) {
      var inp = document.createElement('input'); inp.type = numeric ? 'number' : 'text'
      if (ph) inp.placeholder = ph
      bindText(inp, 'steps.' + i + '.' + key, numeric)
      g.appendChild(field(label, inp))
    }
    pair('中文主字', 'zh', false, '需要访问许可')
    pair('英文副标题', 'en', false, 'ACCESS PERMISSION REQUIRED')
    pair('状态日志', 'log', false, '等待用户授权…')
    pair('日志英文', 'logEn', false, 'AWAITING OPERATOR CONSENT')
    pair('标记词', 'badge', false, 'AUTHORIZATION')
    pair('停留毫秒', 'hold', true, '900')
    body.appendChild(g)

    var act = document.createElement('select')
    ;[['auto', '自动过'], ['grant', '停下来等点击（授权）'], ['confirm', '停下来等点击（确认）']].forEach(function (o) {
      var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]
      if ((step.action || 'auto') === o[0]) op.selected = true
      act.appendChild(op)
    })
    act.onchange = function () { step.action = act.value; scheduleDraft() }
    body.appendChild(field('这一幕要操作吗', act))

    var audio = document.createElement('select')
    ;['', 'line-1', 'line-2', 'line-3', 'line-4', 'line-5', 'line-6'].forEach(function (v) {
      var op = document.createElement('option'); op.value = v; op.textContent = v || '（不挂真声）'
      if ((step.audio || '') === v) op.selected = true
      audio.appendChild(op)
    })
    audio.onchange = function () { step.audio = audio.value; scheduleDraft() }

  /* opts.start / opts.count：从第几幕开始、只播几幕（不传就是从头整段播） */
  var draftSeq = 0
  function pushDraft(opts) {
    opts = opts || {}
    if (timer) { clearTimeout(timer); timer = 0 }   /* 别让上一次的防抖把这次跳转顶掉 */
    var mySeq = ++draftSeq
    json('/editor/draft', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        template: tpl,
        start: (typeof opts.start === 'number') ? opts.start : undefined,
        count: (typeof opts.count === 'number') ? opts.count : undefined

    }).then(function (r) {
      if (!r || !r.ok) { say('预览失败：' + ((r && r.error) || '未知'), 'err'); return }
      if (mySeq !== draftSeq) return   /* 后面还有更新的请求，这次结果作废 */

      var q = '?id=' + draftId + '&edit=1&t=' + Date.now()

      frame.src = API + '/editor/preview' + q
      var wantTitle = (typeof opts.start === 'number') ? ('jump:' + opts.start + ':' + (typeof opts.count === 'number' ? opts.count : '-')) : 'jump:-'
      setTimeout(function () {
        try {

  /* ══ M2：时间线视图 ═══════════════════════════════════════════════════
     图层列表 + 轨道 + 关键帧 + 播放头 + 属性面板。预览还是走 iframe 里的运行时，
     通过 __DSH_STARTUP_API__.seek() 把播放头挪到任意时刻。 */
  var tlView = false
  var tl = { playhead: 0, selected: 0, kfSel: -1 }
  var frameApi = function () {
    try { return (frame.contentWindow && frame.contentWindow.__DSH_STARTUP_API__) || null } catch (e) { return null }
  }

  function tlLayers() { return (tpl && Array.isArray(tpl.layers)) ? tpl.layers : [] }
  function tlDur() { return (tpl && Number(tpl.duration)) || 5200 }

  function tlClockText() {
    return (tl.playhead / 1000).toFixed(2) + 's / ' + (tlDur() / 1000).toFixed(2) + 's'
  }

  /** 把播放头挪到 ms：先暂停运行时，再 seek */
  function seekTo(ms) {
    var d = tlDur()
    tl.playhead = Math.max(0, Math.min(d, Math.round(ms)))
    /* 先把界面上的播放头/时钟挪好：预览即使暂时不可用，时间线手感也不能断 */
    var pct0 = (tl.playhead / d * 100) + '%'
    var ph0 = document.getElementById('tlplayhead'); if (ph0) ph0.style.left = pct0
    var hd0 = document.getElementById('tlhead'); if (hd0) hd0.style.left = pct0
    var clk0 = document.getElementById('tlclock'); if (clk0) clk0.textContent = tlClockText()
    var api = frameApi()
    /* 预览层可能已被卸掉（真实收尾流程）——此时 seek 是空操作，必须重载一份。
       用 root 是否存在来判断，比看 api 在不在准（api 对象会一直挂在 window 上）。 */
    var alive = true
    try {
      var pdoc = frame.contentDocument
      alive = !!(pdoc && pdoc.getElementById('dsh-startup-root'))
    } catch (e3) { alive = !!api }
    if (!alive) {
      var now = Date.now()
      if (!seekTo._lastReload || now - seekTo._lastReload > 1500) {
        seekTo._lastReload = now
        pushDraft()
      }
      return
    }
    try { api.pause() } catch (e) { /* noop */ }
    try { api.seek(tl.playhead) } catch (e2) { /* noop */ }
    var c = document.getElementById('tlclock'); if (c) c.textContent = tlClockText()
    var pct = (tl.playhead / d * 100) + '%'
    var ph = document.getElementById('tlplayhead'); if (ph) ph.style.left = pct
    var hd3 = document.getElementById('tlhead'); if (hd3) hd3.style.left = pct
    updateSelBox()
  }

  /** 在播放头处取某图层的属性值（用于属性面板显示与打点） */
  function valueAt(layer, prop, fallback) {
    var kfs = (layer && Array.isArray(layer.keyframes)) ? layer.keyframes : []
    if (!kfs.length) return fallback
    var prev = null
    for (var i = 0; i < kfs.length; i++) {
      if (kfs[i].t <= tl.playhead) prev = kfs[i]
      else break
    }
    if (!prev) prev = kfs[0]
    return prev[prop] !== undefined ? prev[prop] : fallback
  }

  /** 在播放头处写一个属性：同一时刻已有帧就改它，没有就插一个（其余属性沿用当前值） */
  function setAt(layer, prop, value) {
    if (!layer) return
    if (!Array.isArray(layer.keyframes)) layer.keyframes = []
    var kfs = layer.keyframes
    var hit = null
    for (var i = 0; i < kfs.length; i++) if (Math.abs(kfs[i].t - tl.playhead) <= 12) { hit = kfs[i]; break }
    if (!hit) {
      hit = { t: tl.playhead }
      var props = ['opacity', 'offsetX', 'offsetY', 'scale', 'rotate', 'reveal', 'assemble', 'draw']
      for (var p = 0; p < props.length; p++) {
        var v = valueAt(layer, props[p], undefined)
        if (v !== undefined) hit[props[p]] = v
      }
      kfs.push(hit)
    }
    hit[prop] = value
    kfs.sort(function (a, b) { return a.t - b.t })
  }

  function tlSortKf(layer) { if (layer && Array.isArray(layer.keyframes)) layer.keyframes.sort(function (a, b) { return a.t - b.t }) }

  /* ── 画布上的选中框 ─────────────────────────────────────── */
  function updateSelBox() {
    var box = document.getElementById('tlSelBox')
    if (!box) return
    var L = tlLayers()[tl.selected]
    if (!tlView || !L) { box.hidden = true; return }
    var label = box.querySelector('span')
    if (label) label.textContent = (L.text || L.id || L.type || '图层') + (L.type ? '  ·  ' + L.type : '')
    var placed = false
    try {
      var doc = frame.contentDocument
      var el = doc && doc.querySelector('[data-layer="' + ((L.id || '').replace(/"/g, '')) + '"]')
      if (el) {
        var r = el.getBoundingClientRect()
        box.style.left = Math.round(r.left) + 'px'
        box.style.top = Math.round(r.top) + 'px'
        box.style.width = Math.round(r.width) + 'px'
        box.style.height = Math.round(r.height) + 'px'
        placed = true
      }
    } catch (e) { /* iframe 还没起来 */ }
    if (!placed) {
      var fr = frame.getBoundingClientRect()
      var s = Math.min(fr.width / 1280, fr.height / 720)
      var ox = (fr.width - 1280 * s) / 2, oy = (fr.height - 720 * s) / 2
      var p = (L.pos && L.pos.length) ? L.pos : [640, 360]
      var w = (L.size && L.size[0]) ? L.size[0] : 240
      var h = (L.size && L.size[1]) ? L.size[1] : 48
      box.style.left = Math.round(ox + (p[0] - w / 2) * s) + 'px'
      box.style.top = Math.round(oy + (p[1] - h / 2) * s) + 'px'
      box.style.width = Math.round(w * s) + 'px'
      box.style.height = Math.round(h * s) + 'px'
    }
    box.hidden = false
  }

  /* 缓动曲线缩略图（12×36 采样画成 SVG） */
  var EASE_FNS = {
    linear: function (t) { return t },
    inCubic: function (t) { return t * t * t },
    outCubic: function (t) { return 1 - Math.pow(1 - t, 3) },
    inOutCubic: function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2 },
    outQuint: function (t) { return 1 - Math.pow(1 - t, 5) },
    outBack: function (t) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2) }
  }
  function easePreview(name) {
    var fn = EASE_FNS[name] || EASE_FNS.outCubic
    var pts = []
    for (var i = 0; i <= 12; i++) {
      var t = i / 12
      var y = fn(t)
      pts.push((t * 54 + 3).toFixed(1) + ',' + ((1 - Math.max(-0.15, Math.min(1.15, y))) * 34 + 3).toFixed(1))
    }
    return '<svg width="60" height="40" viewBox="0 0 60 40"><polyline fill="none" stroke="#5cc8ff" stroke-width="1.5" points="' + pts.join(' ') + '"/></svg>'
  }

        var kf = document.createElement('div'); kf.className = 'tlkf' + (i === tl.selected && ki === tl.kfSel ? ' sel' : '')
        kf.style.left = (k.t / d * 100) + '%'
        kf.title = k.t + 'ms'
        kf.onmousedown = function (ev) {
          ev.stopPropagation()
          tl.selected = i; tl.kfSel = ki
          var laneRect = lane.getBoundingClientRect()
          function move(e2) {
            var t2 = Math.max(0, Math.min(d, Math.round((e2.clientX - laneRect.left) / laneRect.width * d / 10) * 10))
            k.t = t2
            kf.style.left = (t2 / d * 100) + '%'
            tlSortKf(L)
            seekTo(t2)
          }
          function up() {
        document.removeEventListener('mousemove', move)
        document.removeEventListener('mouseup', up)
        tl.kfSel = (L.keyframes || []).indexOf(k)
        tlSync(); renderTlTracks(); renderTlPanel()
      }
          document.addEventListener('mousemove', move)
          document.addEventListener('mouseup', up)
        }
        lane.appendChild(kf)
      })
      row.appendChild(nm); row.appendChild(lane); tracks.appendChild(row)
    })
    var pick = document.getElementById('tlLayerPick')
    if (pick) {
      pick.innerHTML = ''
      tlLayers().forEach(function (L2, i2) {
        var op2 = document.createElement('option'); op2.value = String(i2)
        op2.textContent = (i2 + 1) + '. ' + (L2.text || L2.id || L2.type || '图层')
        if (i2 === tl.selected) op2.selected = true
        pick.appendChild(op2)
      })
      pick.onchange = function () {
        tl.selected = Number(pick.value) || 0
        tl.kfSel = -1
        renderTlPanel(); renderTlTracks(); updateSelBox()
      }
    }
    var pct2 = (tl.playhead / d * 100) + '%'
    var ph = document.getElementById('tlplayhead'); if (ph) ph.style.left = pct2
    var hd4 = document.getElementById('tlhead'); if (hd4) hd4.style.left = pct2
    updateSelBox()
  }

  /** 任意点击/拖动时间线 → 播放头跳过去（用刻度尺的横向映射，与轨道对齐） */
  function bindScrub(el) {
    if (!el || el.getAttribute('data-scrub') === '1') return
    el.setAttribute('data-scrub', '1')
    el.addEventListener('mousedown', function (ev) {
      var ruler = document.getElementById('tlruler')
      if (!ruler) return
      var r = ruler.getBoundingClientRect()
      var d = tlDur()
      function at(e2) { return Math.max(0, Math.min(d, (e2.clientX - r.left) / r.width * d)) }
      seekTo(at(ev))
      function move(e2) { ev.preventDefault(); seekTo(at(e2)) }
      function up() { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); renderTlTracks() }
      document.addEventListener('mousemove', move)
      document.addEventListener('mouseup', up)
    })
  }

  function rulerDrag(ev, ruler) {
    var r = ruler.getBoundingClientRect()
    function at(e2) { return Math.max(0, Math.min(tlDur(), (e2.clientX - r.left) / r.width * tlDur())) }
    seekTo(at(ev))
    function move(e2) { seekTo(at(e2)) }
    function up() { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up) }
    document.addEventListener('mousemove', move)
    document.addEventListener('mouseup', up)
  }

  /* 每次改模板都推一次草稿给预览（复用表单视图那条通道） */
  function tlSync() { scheduleDraft() }

  function makeTimelineTemplate() {
    tpl = {
      schemaVersion: 2, id: tpl && tpl.id ? tpl.id : 'my-timeline', name: (tpl && tpl.name) || '我的时间线',
      author: 'LeeRolling', license: 'MIT', version: '0.1.0', description: '用时间线编辑器做的模板',
      duration: 4000,
      theme: { mode: 'dark', bg: '#0b0f14', bg2: '#111823', ink: '#eef4ff', inkSoft: '#b9c9e0', muted: '#6d7f96', hair: 'rgba(160,200,255,0.22)', accent: '#5cc8ff' },
      layers: [
        { id: 'title', type: 'text', text: '我的标题', pos: [640, 330], font: { size: 46, weight: 500, tracking: 0.1 },
          keyframes: [{ t: 200, opacity: 0, offsetY: 24, scale: 0.99, ease: 'outCubic' }, { t: 900, opacity: 1, offsetY: 0, scale: 1 }] },
        { id: 'rule', type: 'line', pos: [400, 392], width: 480, keyframes: [{ t: 700, reveal: 0 }, { t: 1200, reveal: 1 }] }
      ]
    }
    tl.selected = 0; tl.playhead = 0
    renderTlPanel(); renderTlTracks(); tlSync()
    say('已新建时间线模板（记得保存到本地）', 'ok')
  }
  /* ── 时间线视图的进入/退出与按钮 ───────────────────────────── */
  var tlLoadHooked = false
  function tlOnFrameLoad() {
    if (!tlView) return
    var api = frameApi()
    if (!api) return
    try { api.pause() } catch (e) { /* noop */ }
    try { api.seek(tl.playhead) } catch (e2) { /* noop */ }
  }
  /** 画布坐标 → 逻辑坐标（1280×720 letterbox 反解） */
  function canvasToLogical(ev) {
    var rect = frame.getBoundingClientRect()
    var s = Math.min(rect.width / 1280, rect.height / 720)
    var ox = (rect.width - 1280 * s) / 2, oy = (rect.height - 720 * s) / 2
    return { x: (ev.clientX - rect.left - ox) / s, y: (ev.clientY - rect.top - oy) / s }
  }

  function tlPickLayer(x, y) {
    var best = -1, bd = 1e9
    tlLayers().forEach(function (L, i) {
      var p = (L.pos && L.pos.length) ? L.pos : [640, 360]
      var dd = Math.sqrt((p[0] - x) * (p[0] - x) + (p[1] - y) * (p[1] - y))
      if (dd < bd) { bd = dd; best = i }
    })
    return bd < 200 ? best : -1
  }

  var hitBound = false
  function bindCanvasHit() {
    var hit = document.getElementById('tlCanvasHit')
    if (!hit || hitBound) return
    hitBound = true
    hit.onmousedown = function (ev) {
      var pt = canvasToLogical(ev)
      var idx = tlPickLayer(pt.x, pt.y)
      if (idx < 0) return
      ev.preventDefault()
      tl.selected = idx
      var L = tlLayers()[idx]
      if (!L.pos) L.pos = [640, 360]
      var startX = pt.x - L.pos[0], startY = pt.y - L.pos[1]
      function move(e2) {
        var p2 = canvasToLogical(e2)
        var nx = Math.round(Math.max(0, Math.min(1280, p2.x - startX)))
        var ny = Math.round(Math.max(0, Math.min(720, p2.y - startY)))
        /* 居中对齐参考线：靠近画布中线（640 / 360）8px 以内就吸附并亮线 */
        var gv = document.getElementById('tlGuideV')
        var gh = document.getElementById('tlGuideH')
        var SNAP = 8
        if (Math.abs(nx - 640) <= SNAP) { nx = 640; if (gv) { gv.hidden = false; gv.style.left = '50%' } }
        else if (gv) gv.hidden = true
        if (Math.abs(ny - 360) <= SNAP) { ny = 360; if (gh) { gh.hidden = false; gh.style.top = '50%' } }
        else if (gh) gh.hidden = true
        L.pos = [nx, ny]
        renderTlPanel()   /* 拖动中只更新面板数字，松手才让预览重载 */
        updateSelBox()
      }
      function up2() {
        document.removeEventListener('mousemove', move)
        document.removeEventListener('mouseup', up2)
        var gv2 = document.getElementById('tlGuideV'); if (gv2) gv2.hidden = true
        var gh2 = document.getElementById('tlGuideH'); if (gh2) gh2.hidden = true
        tlSync(); renderTlTracks()
      }
      document.addEventListener('mousemove', move)
      document.addEventListener('mouseup', up2)
    }
  }

  /* ── 播放时播放头跟随 ─────────────────────────────────────── */
  var followRaf = 0
  function tlFollowLoop() {
    if (!tlView) { followRaf = 0; return }
    var ctl = null
    try { ctl = frame.contentWindow && frame.contentWindow.__DSH_STARTUP_TL__ } catch (e) { ctl = null }
    if (ctl && typeof ctl.playhead === 'function') {
      var now = Number(ctl.playhead()) || 0
      if (Math.abs(now - tl.playhead) > 8) {
        tl.playhead = now
        var d = tlDur()
        var pct = (now / d * 100) + '%'
        var ph = document.getElementById('tlplayhead'); if (ph) ph.style.left = pct
        var hd = document.getElementById('tlhead'); if (hd) hd.style.left = pct
        var clk = document.getElementById('tlclock'); if (clk) clk.textContent = tlClockText()
      }
    }
    followRaf = requestAnimationFrame(tlFollowLoop)
  }
  function tlStartFollow() { if (!followRaf) followRaf = requestAnimationFrame(tlFollowLoop) }

  function togglePlay() {
    var api = frameApi()
    if (!api) { pushDraft(); return }
    try {
      if (typeof api.paused === 'function' && api.paused()) { api.resume(); say('播放', 'ok') }
      else { api.pause(); say('暂停', 'ok') }
    } catch (e) { /* noop */ }
  }

  /* 空格播放/暂停；左右方向键微调（输入框里不拦） */
  document.addEventListener('keydown', function (ev) {
    if (!tlView) return
    var tag = (ev.target && ev.target.tagName) ? ev.target.tagName.toLowerCase() : ''
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return
    if (ev.code === 'Space' || ev.key === ' ') { ev.preventDefault(); togglePlay(); return }
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); seekTo(tl.playhead - (ev.shiftKey ? 500 : 100)) }
    if (ev.key === 'ArrowRight') { ev.preventDefault(); seekTo(tl.playhead + (ev.shiftKey ? 500 : 100)) }
  })

  function enterTimeline() {
    if (!tpl) { say('先载入一个模板', 'err'); return }
    tlView = true
    tlStartFollow()
    var hit = document.getElementById('tlCanvasHit'); if (hit) hit.hidden = false
    bindCanvasHit()
    document.getElementById('tlbar').hidden = false
    document.getElementById('tlBtn').hidden = true
    document.getElementById('formBtn').hidden = false
    tl.selected = 0; tl.kfSel = -1; tl.playhead = 0
    var durInput = document.getElementById('tlDur')
    if (durInput) durInput.value = tlDur()
    var clk = document.getElementById('tlclock')
    if (clk) clk.textContent = tlClockText()
    if (!tlLoadHooked) { frame.addEventListener('load', tlOnFrameLoad); tlLoadHooked = true }
    renderTlPanel(); renderTlTracks()
    if (tlLayers().length) { pushDraft() }
    say('时间线视图：拖播放头 / 拖菱形改时间 / 改滑块自动打关键帧', 'ok')
  }
  function exitTimeline() {
    tlView = false
    var hit0 = document.getElementById('tlCanvasHit'); if (hit0) hit0.hidden = true
    document.getElementById('tlbar').hidden = true
    document.getElementById('tlBtn').hidden = false
    document.getElementById('formBtn').hidden = true
    render()
  }
  document.getElementById('tlBtn').onclick = function () { enterTimeline() }
  document.getElementById('formBtn').onclick = function () { exitTimeline() }
  document.getElementById('tlPlay').onclick = function () {
    var api = frameApi()
    if (api && typeof api.resume === 'function') { try { api.resume(); say('播放', 'ok'); return } catch (e) { /* noop */ } }
    pushDraft()
  }
  document.getElementById('tlPause').onclick = function () {
    var api = frameApi()
    if (api && typeof api.pause === 'function') { try { api.pause(); say('已暂停 · 可拖播放头', 'ok') } catch (e) { /* noop */ } }
  }
  document.getElementById('tlAddKf').onclick = function () {
    var L = tlLayers()[tl.selected]
    if (!L) { say('先选一个图层', 'err'); return }
    var props = ['opacity', 'scale', 'offsetX', 'offsetY']
    for (var i = 0; i < props.length; i++) setAt(L, props[i], Number(valueAt(L, props[i], props[i] === 'opacity' || props[i] === 'scale' ? 1 : 0)))
    tlSortKf(L); tlSync(); renderTlTracks(); renderTlPanel()
    say('已在 ' + (tl.playhead / 1000).toFixed(2) + 's 打关键帧', 'ok')
  }
  document.getElementById('tlAddLayer').onclick = function () {
    if (!tpl) return
    if (!Array.isArray(tpl.layers)) tpl.layers = []
    tpl.layers.push({
      id: 'layer-' + (tpl.layers.length + 1), type: 'text', text: '新图层', pos: [640, 420],
      font: { size: 28, weight: 400, tracking: 0.06 },
      keyframes: [{ t: tl.playhead, opacity: 1, offsetY: 0, scale: 1 }]
    })
    tl.selected = tpl.layers.length - 1
    tlSync(); renderTlPanel(); renderTlTracks()
  }
  document.getElementById('tlAddLogo').onclick = function () {
    if (!tpl) return
    if (!Array.isArray(tpl.layers)) tpl.layers = []
    tpl.layers.push({
      id: 'line-' + (tpl.layers.length + 1), type: 'logo', shape: 'whale', logoSize: 280,
      pos: [640, 360],
      keyframes: [{ t: 300, draw: 0, opacity: 1 }, { t: 2000, draw: 1, opacity: 1, ease: 'outCubic' }]
    })
    tl.selected = tpl.layers.length - 1
    tlSync(); renderTlPanel(); renderTlTracks()
  }

  var tlAddBlocksBtn = document.getElementById('tlAddBlocks')
  if (tlAddBlocksBtn) tlAddBlocksBtn.onclick = function () {
    if (!tpl) return
    if (!Array.isArray(tpl.layers)) tpl.layers = []
    tpl.layers.push({
      id: 'blocks-' + (tpl.layers.length + 1), type: 'blocks', shape: 'whale', text: 'DSH',
      count: 220, blockSize: 4, spread: 460, shapeScale: 2.4,
      pos: [640, 360],
      keyframes: [{ t: 0, assemble: 0, opacity: 1 }, { t: 2200, assemble: 1, opacity: 1, ease: 'outCubic' }]
    })
    tl.selected = tpl.layers.length - 1
    tlSync(); renderTlPanel(); renderTlTracks()
  }

  document.getElementById('tlAddSeg').onclick = function () {
    if (!tpl) return
    if (!Array.isArray(tpl.segments)) tpl.segments = []
    if (tpl.segments.length >= 12) { say('分段最多 12 个', 'err'); return }
    var d = tlDur()
    var last = tpl.segments.length ? tpl.segments[tpl.segments.length - 1].to : 0
    var from = Math.min(d - 200, last)
    var to = Math.min(d, from + 2000)
    tpl.segments.push({ name: '第 ' + (tpl.segments.length + 1) + ' 幕', from: from, to: to })
    renderTlPanel(); renderTlTracks(); tlSync()
  }

  document.getElementById('tlDur').onchange = function (ev) {
    if (!tpl) return
    var v = Math.max(600, Math.min(30000, Number(ev.target.value) || 4000))
    tpl.duration = v
    ev.target.value = v
    seekTo(Math.min(tl.playhead, v))
    renderTlTracks(); tlSync()
  }

  /* ── 导入 JSON ─────────────────────────────────────────────── */
  /* ── 新建模板：一张白纸 + 两个示例层，直接进时间线 ───────────── */
  document.getElementById('newTpl').onclick = function () {
    var n = Date.now().toString(36).slice(-5)
    tpl = {
      schemaVersion: 2,
      id: 'my-template-' + n,
      name: '未命名模板',
      author: '',
      license: 'MIT',
      version: '0.1.0',
      description: '',
      duration: 6000,
      theme: { mode: 'dark', bg: '#070b11', bg2: '#0d1620', ink: '#eef6ff', inkSoft: '#b7c9db', muted: '#6b7f92', hair: 'rgba(140,200,255,0.22)', accent: '#5cc8ff' },
      segments: [{ name: '第 1 幕', from: 0, to: 3000 }, { name: '第 2 幕', from: 3000, to: 6000 }],
      layers: [
        { id: 'title', type: 'text', text: '标题文字', pos: [640, 320], font: { size: 46, weight: 500, tracking: 0.1 },
          keyframes: [{ t: 200, opacity: 0, offsetY: 26, ease: 'outCubic' }, { t: 1000, opacity: 1, offsetY: 0 }] },
        { id: 'rule', type: 'line', pos: [400, 384], width: 480,
          keyframes: [{ t: 800, reveal: 0, ease: 'outCubic' }, { t: 1300, reveal: 1 }] }
      ]
    }
    tl.selected = 0; tl.playhead = 0; tl.kfSel = -1
    enterTimeline()
    renderTlPanel(); renderTlTracks()
    say('已新建模板：改完记得「保存到本地」', 'ok')
  }

  document.getElementById('importBtn').onclick = function () { document.getElementById('importFile').click() }
  document.getElementById('importFile').onchange = function (ev) {
    var f = ev.target.files && ev.target.files[0]
    if (!f) return
    if (f.size > 512 * 1024) { say('文件太大（>512KB）', 'err'); ev.target.value = ''; return }
    var rd = new FileReader()
    rd.onload = function () {
      try {
        var obj = JSON.parse(String(rd.result))
        if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('不是模板对象')
        if (!obj.id && !obj.steps && !obj.layers) throw new Error('缺 id / steps / layers')
        loadTemplate(obj)
        say('已导入 ' + (obj.name || obj.id || '模板'), 'ok')
      } catch (e) { say('导入失败：' + e.message, 'err') }
      ev.target.value = ''
    }
    rd.readAsText(f)
  }

  document.getElementById('storeBtn').onclick = function () { renderStore() }

  refreshPick()
  fetch(API + '/preview-template?id=archive-warm').then(function (r) { return r.json() }).then(function (j) {
    if (j && j.ok && j.template) loadTemplate(j.template)
    else showEmpty('读不到内置模板。检查插件是否装好，或者从上面下拉框里载入一个。')
  }).catch(function (e) { showEmpty('读不到内置模板：' + e.message) })
  function showEmpty(text) {
    side.innerHTML = ''
    var d = document.createElement('div')
    d.className = 'empty'
    d.textContent = text
    side.appendChild(d)
  }
})();
</script>
</body>
